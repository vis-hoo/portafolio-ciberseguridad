<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingresar &middot; Banco Internacional</title>
  <link rel="stylesheet" href="/css/estilo.css">
</head>
<body class="pagina-acceso">
  <header class="cabecera">
    <div class="contenedor">
      <a href="/" class="marca">Banco Internacional</a>
    </div>
  </header>

  <main class="acceso">
    <h1>Ingresar a su cuenta</h1>
    <p class="entradilla">Use el nombre de usuario y la contraseña entregados por el banco.</p>

    <form id="formulario-login" class="formulario">
      <label for="username">Usuario</label>
      <input type="text" id="username" name="username" autocomplete="username" required>

      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>

      <button type="submit" class="boton">Ingresar</button>
      <p id="mensaje" class="mensaje" hidden></p>
    </form>
  </main>

  <script>
    document.getElementById('formulario-login').addEventListener('submit', async (e) => {
      e.preventDefault();
      const mensaje = document.getElementById('mensaje');
      const datos = {
        username: document.getElementById('username').value,
        password: document.getElementById('password').value,
      };
      const resp = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(datos),
      });
      const cuerpo = await resp.json();
      if (resp.ok) {
        window.location.href = cuerpo.rol === 'ejecutivo' ? '/ejecutivo' : '/cliente';
      } else {
        mensaje.textContent = 'Las credenciales ingresadas no son válidas.';
        mensaje.hidden = false;
      }
    });
  </script>
</body>
</html>
