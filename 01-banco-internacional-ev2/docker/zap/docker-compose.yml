services:
  zap:
    image: zaproxy/zap-stable:latest
    container_name: banco-zap
    restart: unless-stopped
    # ZAP arranca como daemon con el API habilitado. No se usa clave
    # para poder automatizar los escaneos desde los scripts: es una
    # decision de laboratorio, y deja el API expuesto sin autenticacion.
    command: >
      zap.sh -daemon -host 0.0.0.0 -port 8080
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
      -config api.disablekey=true
    ports:
      - "8080:8080"
    volumes:
      - ./reportes:/zap/wrk:rw
    networks:
      - soc-net

networks:
  soc-net:
    name: soc-net
